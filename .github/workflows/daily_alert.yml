name: Daily Stock Alert

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ▼ 探偵ロボット（金庫チェック） ▼
      - name: Secret Test
        run: |
          echo "--- 金庫のチェックを開始します ---"
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ] && [ -z "${{ secrets.slack_webhook_url }}" ]; then
            echo "🚨 エラー: GitHubの金庫が完全に【空っぽ】です！設定画面の登録がうまくいっていません。"
            exit 1
          else
            echo "🌟 成功: GitHubの金庫からURLを正しく見つけました！"
          fi

      - name: Create secrets.toml
        run: |
          mkdir -p .streamlit
          echo 'slack_webhook_url = "${{ secrets.SLACK_WEBHOOK_URL }}"' > .streamlit/secrets.toml
          echo 'discord_webhook_url = "${{ secrets.DISCORD_WEBHOOK_URL }}"' >> .streamlit/secrets.toml

      # ▼ ここを修正しました（大文字だけに統一） ▼
      - name: Run Alert Script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alert_job.py