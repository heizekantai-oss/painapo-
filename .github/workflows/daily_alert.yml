name: Daily Stock Alert

on:
  schedule:
    - cron: '0 0 * * *' # 日本時間の午前9時に自動実行されます
  workflow_dispatch:    # 手動実行ボタンを残す魔法の言葉

jobs:
  run-alert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create secrets.toml
        run: |
          mkdir -p .streamlit
          echo 'slack_webhook_url = "${{ secrets.SLACK_WEBHOOK_URL }}"' > .streamlit/secrets.toml
          echo 'discord_webhook_url = "${{ secrets.DISCORD_WEBHOOK_URL }}"' >> .streamlit/secrets.toml

      - name: Run Alert Script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python alert_job.py